# Training opponent pool for TaurosV1B (gen1ou).
#
# Phase 1 intentionally contains only strong frozen public opponents. TaurosV1A is
# currently below TaurosV0, so feeding its history (or an unproven early V1B history)
# back into the learner would weaken the curriculum. Once V1B reliably exceeds
# TaurosV0 on the held-out validation matrix, a second-stage pool can add recency-
# weighted V1B self-play.
#
# Approximate row mass (16 rows total):
#   TaurosV0 4, Kakuna 3, V2ADataAblation 2, SyntheticRLV2 2,
#   Superkazam 2, Alakazam 1, Kadabra3 1, SyntheticRLV1 1.
defaults:
  team_set: hl_05_26
  battle_backend: metamon
  checkpoints: [null]
  temperatures: [0.75, 1.0, 1.25, 1.5, 1.75]
  num_agents: 1

agents:
  TaurosV0:
    model_name: TaurosV0
    num_agents: 4
    checkpoints: "range(50, 63, 2)"

  Kakuna:
    model_name: Kakuna
    num_agents: 3
    checkpoints: "range(24, 35, 2)"

  V2ADataAblation:
    model_name: V2AGroupedV2DataAblation
    num_agents: 2
    checkpoints: "range(74, 91, 2)"

  SyntheticRLV2:
    model_name: SyntheticRLV2
    num_agents: 2
    checkpoints: "range(36, 49, 2)"

  Superkazam:
    model_name: Superkazam
    num_agents: 2
    checkpoints: "range(38, 51, 2)"

  Alakazam:
    model_name: Alakazam
    checkpoints: "range(2, 9, 2)"

  Kadabra3:
    model_name: Kadabra3
    checkpoints: "range(10, 21, 2)"

  SyntheticRLV1:
    model_name: SyntheticRLV1
    checkpoints: [null]
