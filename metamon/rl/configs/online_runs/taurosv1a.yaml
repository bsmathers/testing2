# Online RL recipe for TaurosV1A (gen1ou)
#
# Finetunes TaurosV0 against a public Hugging Face roster + evolving self-checkpoints.
# Contains no SmallG1Online models and requires only public HF datasets/models.

run_name: taurosv1a
base_model: TaurosV0
base_checkpoint: 62
battle_format: gen1ou

dataset_config: online_selfplay_taurosv1a.yaml
train_gin_config: grouped_v2_large_isfilter.gin
train_pool: metamon/rl/configs/opponent_pools/hl_gen1ou_taurosv1a.yaml
train_team_set: metamon/rl/configs/team_sets/mediumg1_train.yaml

val_pool: metamon/rl/configs/opponent_pools/taurosv1a_val.yaml
val_team_set: expert_curated

online_weight: 0.50
online_anneal_epochs: 10
learning_rate: 1.0e-4
lr_warmup_epochs: 15
batch_size_per_gpu: 14
epochs: 1000
steps_per_epoch: 1000
ckpt_interval: 10

# Collect defaults
lanes: 96
n_workers: 1
train_timesteps_per_epoch: 500
temp_low: 1.0
temp_high: 3.0

# Validate defaults
val_timesteps: 2000
val_interval: 1
