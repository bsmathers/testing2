# TaurosV1B phase E: 900 epochs of public-only online RL after Phase C.
#
# Launch with the audited runner, NOT metamon.rl.online_rl:
#   python -m metamon.rl.taurosv1b_online \
#     --run_config metamon/rl/configs/online_runs/taurosv1b.yaml \
#     --mode learn --save_dir ... --buffer_dir ... \
#     --base_weights /path/to/phase_c_from_b1_lr1e6.pt
#
# The base_model supplies only the exact V1/V1A 35M architecture/spaces. Its
# checkpoint is not the initialization: --base_weights is the completed Phase-C
# checkpoint from the direct C -> E -> F pipeline.

run_name: taurosv1b_phase_e
base_model: TaurosV1A
battle_format: gen1ou

dataset_config: online_selfplay_taurosv1b.yaml
train_gin_config: grouped_v2_large_robust_awr_beta2_kl50.gin
train_pool: metamon/rl/configs/opponent_pools/hl_gen1ou_taurosv1b.yaml
# Public/reproducible team set. Do not use mediumg1_train here on a fresh host:
# it references local-only expert/expert_curated2 directories.
train_team_set: metamon/rl/configs/team_sets/taurosv1b_public_train.yaml

# modern_replays_v2 remains outside the V1B training team set.
val_pool: metamon/rl/configs/opponent_pools/taurosv1b_val.yaml
val_team_set: modern_replays_v2

# Buffer is never sampled before dset_min_size is satisfied. When prefilled,
# online share follows 20% -> 60% over epochs 0..400, then stays at 60%.
dset_max_size: 150000
dset_min_size: 5000
initial_online_weight: 0.20
online_weight: 0.60
online_anneal_start_epoch: 0
online_anneal_end_epoch: 400

# Preserve the C policy early in two ways:
#   1) LR starts at 5e-6 and reaches 8e-5 over 100 learner epochs.
#   2) KL(pi_C || pi_theta) starts at coefficient 1.0 and linearly reaches 0
#      over the first 50 learner epochs (configured in the KL50 gin file).
learning_rate: 8.0e-5
lr_warmup_start_lr: 5.0e-6
lr_warmup_epochs: 100
# Keep the sequence-level advantage filter near-neutral while the critic/policy
# adapt to online data. This is independent of the LR ramp.
seq_floor_warmup_epochs: 20
# Keep the same effective batch (14 trajectories/update) while cutting peak
# learner activation memory roughly in half. This is required when the async
# collector and learner share a 16 GB GPU.
batch_size_per_gpu: 7
grad_accum: 2
epochs: 900
steps_per_epoch: 1000

# The callback fires every 5 epochs so the in-memory model can play a 50-game
# tournament against TaurosV0@62 and log the win rate. The V1B checkpoint hook
# persists raw policies every 25 epochs and full states every 25.
ckpt_interval: 5
full_state_ckpt_interval: 25
mixed_precision: "no"

lanes: 128
n_workers: 8
train_timesteps_per_epoch: 500
temp_low: 1.0
temp_high: 2.25

# Learn-only mode disables the ordinary validator; the explicit 50-game V0
# tournament is the live external health check used by this pipeline.
val_timesteps: 2000
val_interval: 10
